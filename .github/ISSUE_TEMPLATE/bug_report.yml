name: Bug report
description: Report a reproducible problem in training, inference, or tooling
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue. Please provide enough detail to reproduce it.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
      placeholder: Describe the bug and its impact.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Exact steps, commands, and inputs used.
      placeholder: |
        1. Run command ...
        2. Use input file ...
        3. Observe error ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What you expected to happen.
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit/branch
      description: The commit SHA or branch you tested.
      placeholder: main / abc1234
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Ubuntu/Linux
        - Windows
        - macOS
        - Other
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.10.14"
    validations:
      required: true
  - type: input
    id: torch
    attributes:
      label: PyTorch version
      placeholder: "2.0.1"
    validations:
      required: true
  - type: input
    id: cuda
    attributes:
      label: CUDA version (if applicable)
      placeholder: "11.8"
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or traceback
      description: Paste full error output if possible.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I can reproduce this issue on the latest main branch.
          required: true
