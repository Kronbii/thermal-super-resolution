# Tool configuration only (the repository is not an installable package).

[tool.ruff]
line-length = 100
target-version = "py310"
include = ["benchmark/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["benchmark", "model"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
